name: One-shot MK4 verification with recorded result

on:
  push:
    branches:
      - mk4-model-managed-semantic-memory

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mk4-model-managed-semantic-memory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r MK4/requirements.txt pytest pytest-asyncio

      - name: Run tests and record result
        shell: bash
        run: |
          set +e
          python -m pytest MK4/tests -q
          status=$?
          set -e
          rm .github/workflows/verify-mk4-memory-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-mk4-memory-pr.yml
          if [ "$status" = "0" ]; then
            message="MK4 tests passed"
          else
            message="MK4 tests failed (status=$status)"
          fi
          git commit -m "$message"
          git push origin HEAD:mk4-model-managed-semantic-memory
          exit "$status"
