name: One-shot MK4 memory PR verification

on:
  push:
    branches:
      - mk4-model-managed-semantic-memory

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mk4-model-managed-semantic-memory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r MK4/requirements.txt pytest pytest-asyncio

      - name: Run MK4 tests
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest MK4/tests -q
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/verify-mk4-memory-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-mk4-memory-pr.yml
          git commit -m "Remove one-shot MK4 verification workflow"
          git push origin HEAD:mk4-model-managed-semantic-memory

      - name: Report pytest result
        shell: bash
        run: |
          status='${{ steps.pytest.outputs.status }}'
          if [ "$status" != "0" ]; then
            echo "MK4 pytest failed with status $status"
            exit "$status"
          fi
          echo "MK4 pytest passed"
