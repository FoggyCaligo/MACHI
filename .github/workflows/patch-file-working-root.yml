# trigger
name: Patch MK4 file working root

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch orchestrator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('MK4/core/agent/orchestrator.py')
          text = p.read_text(encoding='utf-8-sig')
          text = text.replace('        self._auto_read_attachment_paths: dict[str, set[str]] = {}\n', '        self._auto_read_attachment_paths: dict[str, set[str]] = {}\n        self._file_working_roots: dict[str, str] = {}\n', 1)
          text = text.replace('        conversation_key = f"{user_id}::{session_id or \'default\'}"\n', '        conversation_key = f"{user_id}::{session_id or \'default\'}"\n        file_working_root = self._file_working_roots.get(conversation_key, ".")\n', 1)
          old = '            for call in turn.tool_calls:\n                call = _redirect_text_document_read_call(call)\n'
          new = '            for call in turn.tool_calls:\n                original_call = call\n                call = _redirect_text_document_read_call(call)\n                call = _normalize_file_tool_call(call, file_working_root)\n'
          if old not in text: raise SystemExit('tool loop anchor not found')
          text = text.replace(old, new, 1)
          old2 = '                event = {\n                    "tool": call.tool,\n                    "arguments": result["arguments"],\n                    "result": result["result"],\n                }\n'
          new2 = '''                if call.tool in _FILE_RELATED_TOOLS and isinstance(result.get("result"), dict):\n                    adopted_root = _maybe_adopt_file_working_root(current_root=file_working_root, tool=call.tool, original_arguments=original_call.arguments, result=result["result"])\n                    if adopted_root != file_working_root:\n                        file_working_root = adopted_root\n                        self._file_working_roots[conversation_key] = file_working_root\n                    result["result"]["file_working_root"] = file_working_root\n                    result["result"]["path_base_hint"] = "Relative file paths are resolved from this file_working_root. You may use app/static/index.html or ./app/static/index.html."\n                event = {\n                    "tool": call.tool,\n                    "arguments": result["arguments"],\n                    "result": result["result"],\n                }\n'''
          if old2 not in text: raise SystemExit('event anchor not found')
          text = text.replace(old2, new2, 1)
          anchor = '\ndef _redirect_text_document_read_call(call: ToolCall) -> ToolCall:\n'
          helpers = r'''
_FILE_PATH_TOOLS = {"file_read", "file_create", "file_update", "file_delete", "file_download_link", "document_read", "image_analyze"}
_FILE_ROOT_TOOLS = {"file_tree", "file_search", "file_text_search"}
_FILE_RELATED_TOOLS = _FILE_PATH_TOOLS | _FILE_ROOT_TOOLS


def _is_absolute_file_argument(value: str) -> bool:
    normalized = value.replace("\\", "/")
    return normalized.startswith("/") or bool(re.match(r"^[A-Za-z]:/", normalized))


def _normalize_under_file_root(value: str, file_working_root: str) -> str:
    raw = str(value or "").strip().replace("\\", "/")
    if not raw or file_working_root in {"", "."} or _is_absolute_file_argument(raw):
        return raw or "."
    while raw.startswith("./"):
        raw = raw[2:]
    root = file_working_root.strip("/")
    if raw in {"", "."}:
        return root
    if raw == root or raw.startswith(root + "/"):
        return raw
    return f"{root}/{raw}"


def _normalize_file_tool_call(call: ToolCall, file_working_root: str) -> ToolCall:
    if call.tool not in _FILE_RELATED_TOOLS or file_working_root in {"", "."}:
        return call
    arguments = dict(call.arguments)
    if call.tool in _FILE_PATH_TOOLS:
        path = str(arguments.get("path") or "").strip()
        if path:
            arguments["path"] = _normalize_under_file_root(path, file_working_root)
    else:
        root = str(arguments.get("root") or ".").strip() or "."
        arguments["root"] = _normalize_under_file_root(root, file_working_root)
    return ToolCall(tool=call.tool, arguments=arguments)


def _maybe_adopt_file_working_root(*, current_root: str, tool: str, original_arguments: dict, result: dict) -> str:
    if current_root not in {"", "."} or tool not in _FILE_ROOT_TOOLS or result.get("ok") is not True:
        return current_root
    root = str(original_arguments.get("root") or ".").strip().replace("\\", "/").strip("/")
    while root.startswith("./"):
        root = root[2:]
    if not root or root in {".", ".."} or "/" in root or _is_absolute_file_argument(root):
        return current_root
    return root

'''
          if anchor not in text: raise SystemExit('helper anchor not found')
          p.write_text(text.replace(anchor, '\n' + helpers + anchor.lstrip('\n'), 1), encoding='utf-8')
          Path('MK4/tests/test_file_working_root.py').write_text(r'''from MK4.core.agent.orchestrator import _maybe_adopt_file_working_root, _normalize_file_tool_call
from MK4.tools.tool_runtime import ToolCall

def test_first_top_level_discovery_adopts_root():
    assert _maybe_adopt_file_working_root(current_root='.', tool='file_tree', original_arguments={'root':'MK4'}, result={'ok':True}) == 'MK4'

def test_nested_paths_resolve_under_active_root():
    assert _normalize_file_tool_call(ToolCall(tool='file_read', arguments={'path':'app/static/index.html'}), 'MK4').arguments['path'] == 'MK4/app/static/index.html'

def test_dot_root_resolves_to_active_root():
    assert _normalize_file_tool_call(ToolCall(tool='file_text_search', arguments={'query':'<select'}), 'MK4').arguments['root'] == 'MK4'

def test_existing_workspace_relative_path_is_not_double_prefixed():
    assert _normalize_file_tool_call(ToolCall(tool='file_read', arguments={'path':'MK4/app/static/index.html'}), 'MK4').arguments['path'] == 'MK4/app/static/index.html'

def test_document_and_image_paths_share_file_root():
    assert _normalize_file_tool_call(ToolCall(tool='document_read', arguments={'path':'./docs/a.pdf'}), 'MK4').arguments['path'] == 'MK4/docs/a.pdf'
    assert _normalize_file_tool_call(ToolCall(tool='image_analyze', arguments={'path':'assets/a.png'}), 'MK4').arguments['path'] == 'MK4/assets/a.png'
''', encoding='utf-8')
          PY
      - name: Run focused tests
        run: |
          python -m pip install -e . pytest pytest-asyncio
          pytest -q MK4/tests/test_file_working_root.py MK4/tests/test_file_mutation_completion_contract.py MK4/tests/test_agent_round_guard.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MK4/core/agent/orchestrator.py MK4/tests/test_file_working_root.py
          git commit -m "MK4: add session file working root"
          git push origin HEAD:${{ github.head_ref }}
