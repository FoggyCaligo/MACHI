name: One-shot MK4 memory test cleanup

on:
  push:
    branches:
      - mk4-model-managed-semantic-memory

permissions:
  contents: write

jobs:
  patch-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mk4-model-managed-semantic-memory
          fetch-depth: 0
      - name: Patch stale memory-contract tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('MK4/tests/test_orchestrator.py')
          text = path.read_text(encoding='utf-8-sig')
          replacements = [
              (
                  '        if self.turns == 1:\n            assert memory_summary\n            return ModelTurn(\n',
                  '        if self.turns == 1:\n            assert memory_summary == []\n            return ModelTurn(\n',
                  'stale memory_summary assertion block',
              ),
              (
                  '    memory.record_user_utterance(user_id="bob", text="I use JavaScript.", session_id="s1")\n    bob_fact = next(\n        node\n        for node in repo.all_nodes()\n        if node.node_type == "fact" and node.payload.get("user_id") == "bob"\n    )\n    correction_event = await orchestrator._run_tool_call(\n        ToolCall(\n            tool="record_memory_correction",\n            arguments={\n                "user_id": "alice",\n                "previous_fact_id": bob_fact.node_id,\n                "replacement_text": "I use TypeScript.",\n            },\n        ),\n        user_id="bob",\n        utterance_id=bob_utterance_id,\n    )\n\n    assert correction_event["arguments"]["user_id"] == "bob"\n    assert correction_event["result"]["replacement_fact_id"]\n',
                  '    assert not orchestrator.tool_registry.has_tool("record_memory_correction")\n',
                  'legacy correction test block',
              ),
              (
                  'async def test_orchestrator_pushes_relevant_memory_summary_into_model() -> None:\n',
                  'async def test_orchestrator_does_not_push_automatic_memory_summary_into_model() -> None:\n',
                  'automatic summary test name',
              ),
              (
                  '    assert result.text == "done"\n    assert chat_model.memory_summaries\n    assert isinstance(chat_model.memory_summaries[-1][0], dict)\n    assert "score" in chat_model.memory_summaries[-1][0]\n    repo.close()\n',
                  '    assert result.text == "done"\n    assert chat_model.memory_summaries == [[]]\n    repo.close()\n',
                  'automatic summary assertions',
              ),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise RuntimeError(f'{label} not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/patch-mk4-memory-tests.yml').unlink()
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MK4/tests/test_orchestrator.py .github/workflows/patch-mk4-memory-tests.yml
          git diff --cached --check
          git commit -m "Align orchestrator tests with explicit recall memory"
          git push origin HEAD:mk4-model-managed-semantic-memory
