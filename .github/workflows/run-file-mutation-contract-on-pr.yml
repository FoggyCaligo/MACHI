name: Run MK4 file mutation completion patch on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Wire completion guard into orchestrator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('MK4/core/agent/orchestrator.py')
          text = p.read_text(encoding='utf-8-sig')
          old_import = 'from .prompts import SYSTEM_PROMPT\n'
          new_import = 'from .file_completion import file_mutation_completion_guard_result\nfrom .prompts import SYSTEM_PROMPT\n'
          if old_import not in text:
              raise SystemExit('orchestrator import anchor not found')
          text = text.replace(old_import, new_import, 1)
          old_guard = '''                ) or _file_execution_guard_result(\n                    tool_history=tool_history,\n                    rejected_final_answer=turn.final_answer,\n                )\n'''
          new_guard = '''                ) or file_mutation_completion_guard_result(\n                    user_message=message,\n                    tool_history=tool_history,\n                    rejected_final_answer=turn.final_answer,\n                ) or _file_execution_guard_result(\n                    tool_history=tool_history,\n                    rejected_final_answer=turn.final_answer,\n                )\n'''
          if old_guard not in text:
              raise SystemExit('orchestrator final guard anchor not found')
          p.write_text(text.replace(old_guard, new_guard, 1), encoding='utf-8')
          PY
      - name: Test focused behavior
        run: |
          python -m pip install -e . pytest pytest-asyncio
          pytest -q MK4/tests/test_file_mutation_completion_contract.py MK4/tests/test_agent_round_guard.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MK4/core/agent/orchestrator.py
          git commit -m "MK4: enforce file mutation completion guard"
          git push origin HEAD:${{ github.head_ref }}
