name: One-shot MK4 pytest diagnosis

on:
  push:
    branches:
      - mk4-model-managed-semantic-memory

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mk4-model-managed-semantic-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r MK4/requirements.txt pytest pytest-asyncio
      - name: Run tests and persist result
        shell: bash
        run: |
          set +e
          python -m pytest MK4/tests -q --tb=short > /tmp/mk4-pytest.txt 2>&1
          status=$?
          set -e
          rm .github/workflows/diagnose-mk4-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" = "0" ]; then
            rm -f MK4/tests/.pytest_failure_report.txt
            git add -A
            git commit -m "MK4 tests passed"
          else
            tail -n 240 /tmp/mk4-pytest.txt > MK4/tests/.pytest_failure_report.txt
            git add -A
            git commit -m "Record MK4 pytest failures (status=$status)"
          fi
          git push origin HEAD:mk4-model-managed-semantic-memory
          exit "$status"
