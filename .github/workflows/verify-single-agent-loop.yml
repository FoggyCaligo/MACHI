name: Verify single agent loop

on:
  push:
    branches:
      - mk4-framework-owned-first-recall

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MK4 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r MK4/requirements.txt pytest pytest-asyncio
      - name: Run MK4 tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest MK4/tests -q --tb=short > /tmp/mk4-tests.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/mk4-tests.txt
          exit 0
      - name: Record result and remove workflow
        env:
          STATUS: ${{ steps.tests.outputs.status }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/verify-single-agent-loop.yml
          if [ "$STATUS" = "0" ]; then
            rm -f MK4_TEST_FAILURES.txt
            git add -A
            git commit -m 'MK4 single-agent-loop tests passed'
            git push origin HEAD:mk4-framework-owned-first-recall
          else
            cp /tmp/mk4-tests.txt MK4_TEST_FAILURES.txt
            git add -A
            git commit -m "Record single-agent-loop test failures (status=$STATUS)"
            git push origin HEAD:mk4-framework-owned-first-recall
            exit "$STATUS"
          fi
