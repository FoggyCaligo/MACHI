name: One-shot MK4 regression fixes

on:
  push:
    branches:
      - mk4-model-managed-semantic-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mk4-model-managed-semantic-memory
          fetch-depth: 0

      - name: Apply targeted regression fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str, label: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise RuntimeError(f'{label} not found in {path_str}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'MK4/tests/test_file_navigation_tools.py',
              '''def test_system_prompt_requires_complete_file_edit_workflow() -> None:\n    assert "file_tree" in SYSTEM_PROMPT\n    assert "file_text_search" in SYSTEM_PROMPT\n    assert "do not stop after merely locating a file" in SYSTEM_PROMPT\n    assert "verify the important changed section" in SYSTEM_PROMPT\n''',
              '''def test_system_prompt_requires_inspect_change_verify_workflow() -> None:\n    assert "Inspect before changing state and verify afterward." in SYSTEM_PROMPT\n    assert "prefer code_index/code_search before targeted reads" in SYSTEM_PROMPT\n''',
              'file prompt test block',
          )

          replace_once(
              'MK4/tests/test_graph_broad_recall.py',
              '''def test_memory_summary_ends_with_structural_graph_search_note() -> None:\n    repo = GraphRepository(":memory:")\n    memory = GraphMemoryService(repo)\n    memory.record_user_utterance(\n        user_id="alice",\n        text="I enjoy TypeScript and frontend work.",\n        session_id="s1",\n    )\n    tools = GraphToolSuite(memory)\n\n    summary = tools.get_user_memory_summary(\n        user_id="alice",\n        query="frontend",\n        limit=5,\n    )\n\n    note = summary[-1]\n    assert note["node_type"] == "system_note"\n    assert note["subgraph"]["focus"]["provenance"] == "system_policy"\n    assert "graph_search" in note["label"]\n    assert "partial automatic recall" in note["label"]\n    repo.close()\n\n\n''',
              '',
              'automatic memory system-note test',
          )

          path = Path('MK4/tests/test_orchestrator.py')
          text = path.read_text(encoding='utf-8-sig')
          if 'terminal_filesystem_change_not_verified' not in text:
              raise RuntimeError('old terminal guard name not found')
          text = text.replace('terminal_filesystem_change_not_verified', 'terminal_change_not_verified')
          old = '''@pytest.mark.asyncio\nasync def test_orchestrator_rejects_local_tool_blocked_before_terminal_attempt(tmp_path) -> None:\n    repo = GraphRepository(":memory:")\n    memory = GraphMemoryService(repo)\n    graph_tools = GraphToolSuite(memory)\n    chat_model = LocalToolBlockedThenTerminalModel()\n    orchestrator = AgentOrchestrator(\n        memory_service=memory,\n        graph_tools=graph_tools,\n        chat_model=chat_model,\n        web_search=CapturingWebSearchTool(),\n    )\n    orchestrator.register_tool_registry(TerminalToolSuite(tmp_path).build_registry())\n\n    result = await orchestrator.respond(\n        user_id="alice",\n        message="git 커밋 목록을 터미널로 확인해줘.",\n        model=None,\n        session_id="s1",\n    )\n\n    assert result.text == "커밋 목록을 확인했습니다."\n    assert chat_model.saw_blocked_guard is True\n    assert any(event["tool"] == "terminal_command" for event in result.tool_events)\n    repo.close()\n'''
          new = '''@pytest.mark.asyncio\nasync def test_orchestrator_passes_blocked_answer_without_text_heuristic(tmp_path) -> None:\n    repo = GraphRepository(":memory:")\n    memory = GraphMemoryService(repo)\n    graph_tools = GraphToolSuite(memory)\n    chat_model = LocalToolBlockedThenTerminalModel()\n    orchestrator = AgentOrchestrator(\n        memory_service=memory,\n        graph_tools=graph_tools,\n        chat_model=chat_model,\n        web_search=CapturingWebSearchTool(),\n    )\n    orchestrator.register_tool_registry(TerminalToolSuite(tmp_path).build_registry())\n\n    result = await orchestrator.respond(\n        user_id="alice",\n        message="git 커밋 목록을 터미널로 확인해줘.",\n        model=None,\n        session_id="s1",\n    )\n\n    assert result.text == "로컬 작업을 진행할 수 없습니다."\n    assert chat_model.saw_blocked_guard is False\n    assert not any(event["tool"] == "terminal_command" for event in result.tool_events)\n    repo.close()\n'''
          if old not in text:
              raise RuntimeError('obsolete orchestrator blocked-guard test block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'MK4/tools/llm_client.py',
              '''        recovery = result.get("recovery")\n        if isinstance(recovery, dict) and isinstance(recovery.get("next_tools"), list):\n            compact["next_tools"] = recovery.get("next_tools")[:8]\n        return compact\n''',
              '''        recovery = result.get("recovery")\n        if isinstance(recovery, dict):\n            compact["recovery"] = _compact_value(recovery, limit=700)\n            if isinstance(recovery.get("next_tools"), list):\n                compact["next_tools"] = recovery.get("next_tools")[:8]\n        return compact\n''',
              'tool error recovery compaction block',
          )

          replace_once(
              'MK4/core/agent/orchestrator.py',
              '''def _empty_turn_after_tool_guard_result(*, tool_history: list[dict]) -> dict:\n    latest_tool = tool_history[-1].get("tool") if tool_history else None\n    latest_result = tool_history[-1].get("result") if tool_history else None\n    if not tool_history:\n''',
              '''def _empty_turn_after_tool_guard_result(*, tool_history: list[dict]) -> dict:\n    latest_event = next(\n        (\n            event\n            for event in reversed(tool_history)\n            if event.get("tool") not in {"execution_guard", "autonomy_guard", "file_text_activation"}\n        ),\n        None,\n    )\n    latest_tool = latest_event.get("tool") if latest_event is not None else None\n    latest_result = latest_event.get("result") if latest_event is not None else None\n    if latest_event is None:\n''',
              'empty-turn latest substantive tool selection',
          )

          Path('.github/workflows/patch-mk4-regressions.yml').unlink()
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align tests and recovery with explicit memory architecture"
          git push origin HEAD:mk4-model-managed-semantic-memory
