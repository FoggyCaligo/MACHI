name: One-shot compact recovery fix

on:
  push:
    branches:
      - mk4-model-managed-semantic-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mk4-model-managed-semantic-memory
          fetch-depth: 0
      - name: Keep closest matches without restoring verbose recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('MK4/tools/llm_client.py')
          text = path.read_text(encoding='utf-8-sig')
          old = '''        recovery = result.get("recovery")\n        if isinstance(recovery, dict):\n            compact["recovery"] = _compact_value(recovery, limit=700)\n            if isinstance(recovery.get("next_tools"), list):\n                compact["next_tools"] = recovery.get("next_tools")[:8]\n        return compact\n'''
          new = '''        recovery = result.get("recovery")\n        if isinstance(recovery, dict):\n            if isinstance(recovery.get("next_tools"), list):\n                compact["next_tools"] = recovery.get("next_tools")[:8]\n            if isinstance(recovery.get("closest_matches"), list):\n                compact["closest_matches"] = _compact_value(recovery.get("closest_matches"), limit=240)\n        return compact\n'''
          if old not in text:
              raise RuntimeError('verbose recovery compaction block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('MK4/tests/test_tool_suites.py')
          text = path.read_text(encoding='utf-8-sig')
          old = '    assert compact["recovery"]["closest_matches"]\n'
          new = '    assert compact["closest_matches"]\n'
          if old not in text:
              raise RuntimeError('file_update compact recovery assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/patch-mk4-compact-recovery.yml').unlink()
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Keep compact file recovery candidates"
          git push origin HEAD:mk4-model-managed-semantic-memory
