name: Patch MK4 file mutation completion contract

on:
  push:
    branches: [mk4/file-mutation-completion-contract]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mk4/file-mutation-completion-contract
          fetch-depth: 0

      - name: Patch completion contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('MK4/core/agent/orchestrator.py')
          text = path.read_text(encoding='utf-8-sig')

          old = '''                ) or _file_execution_guard_result(\n                    tool_history=tool_history,\n                    rejected_final_answer=turn.final_answer,\n                )\n'''
          new = '''                ) or _file_mutation_completion_guard_result(\n                    user_message=message,\n                    tool_history=tool_history,\n                    rejected_final_answer=turn.final_answer,\n                ) or _file_execution_guard_result(\n                    tool_history=tool_history,\n                    rejected_final_answer=turn.final_answer,\n                )\n'''
          if old not in text:
              raise SystemExit('final guard chain block not found')
          text = text.replace(old, new, 1)

          anchor = '''def _file_execution_guard_result(\n    *,\n    tool_history: list[dict],\n    rejected_final_answer: str,\n) -> dict | None:\n'''
          insert = r'''_FILE_MUTATION_REQUEST_PATTERNS = (
    re.compile(r"(?:파일|코드|html|css|js|javascript|typescript|python|문서).{0,30}(?:수정|변경|고쳐|바꿔|추가|삭제|제거|없애|작성|만들|적용|반영|rename|이름)", re.IGNORECASE),
    re.compile(r"(?:수정|변경|고쳐|바꿔|추가|삭제|제거|없애|작성|만들|적용|반영).{0,30}(?:파일|코드|html|css|js|javascript|typescript|python|문서)", re.IGNORECASE),
    re.compile(r"\b(?:edit|modify|update|change|remove|delete|add|create|write|rename)\b.{0,40}\b(?:file|code|html|css|javascript|typescript|python|document)\b", re.IGNORECASE),
)


def _requires_file_mutation(user_message: str) -> bool:
    normalized = " ".join(str(user_message or "").split())
    if not normalized:
        return False
    return any(pattern.search(normalized) for pattern in _FILE_MUTATION_REQUEST_PATTERNS)


def _successful_file_mutations(tool_history: list[dict]) -> list[tuple[int, str, str]]:
    mutations: list[tuple[int, str, str]] = []
    for index, event in enumerate(tool_history):
        tool = str(event.get("tool") or "")
        result = event.get("result")
        arguments = event.get("arguments")
        if tool in {"file_create", "file_update", "file_delete"} and isinstance(result, dict) and result.get("ok") is True:
            path = ""
            if isinstance(arguments, dict):
                path = str(arguments.get("path") or "").strip()
            mutations.append((index, tool, path))
            continue
        if tool == "terminal_command" and isinstance(result, dict) and result.get("filesystem_changed") is True:
            changed_paths = result.get("changed_paths")
            if isinstance(changed_paths, list) and changed_paths:
                for changed_path in changed_paths:
                    mutations.append((index, tool, str(changed_path or "").strip()))
            else:
                mutations.append((index, tool, ""))
    return mutations


def _has_verification_after_mutation(
    *,
    tool_history: list[dict],
    mutation_index: int,
    mutation_path: str,
) -> bool:
    for event in tool_history[mutation_index + 1:]:
        if event.get("tool") != "file_read":
            continue
        result = event.get("result")
        if not isinstance(result, dict) or result.get("ok") is not True:
            continue
        read_path = str(result.get("path") or "").strip()
        if not mutation_path or not read_path or read_path == mutation_path:
            return True
    return False


def _file_mutation_completion_guard_result(
    *,
    user_message: str,
    tool_history: list[dict],
    rejected_final_answer: str,
) -> dict | None:
    if not _requires_file_mutation(user_message):
        return None

    mutations = _successful_file_mutations(tool_history)
    if not mutations:
        return {
            "ok": False,
            "error": "requested_file_mutation_not_performed",
            "message": (
                "The user requested a file/code change, but no successful file mutation has occurred. "
                "Do not answer with a plan or claim completion. Inspect as needed, then call file_update, "
                "file_create, file_delete, or a verified filesystem-changing tool."
            ),
            "rejected_final_answer": rejected_final_answer,
        }

    mutation_index, mutation_tool, mutation_path = mutations[-1]
    if mutation_tool == "file_delete":
        return None
    if _has_verification_after_mutation(
        tool_history=tool_history,
        mutation_index=mutation_index,
        mutation_path=mutation_path,
    ):
        return None
    return {
        "ok": False,
        "error": "requested_file_mutation_not_verified",
        "message": (
            "A requested file change succeeded, but the changed file has not been read after the mutation. "
            "Verify the current file contents with file_read before returning a final answer."
        ),
        "path": mutation_path,
        "rejected_final_answer": rejected_final_answer,
    }


'''
          if anchor not in text:
              raise SystemExit('file execution guard anchor not found')
          text = text.replace(anchor, insert + anchor, 1)
          path.write_text(text, encoding='utf-8')

          prompt_path = Path('MK4/core/agent/prompts.py')
          prompt = prompt_path.read_text(encoding='utf-8-sig')
          old_prompt = 'When editing: discover -> inspect the relevant section -> update/create/delete -> read the changed section again to verify. Prefer exact old/new replacement for local edits; use full overwrite only when appropriate.\n'
          new_prompt = 'When editing: discover -> inspect the relevant section -> update/create/delete -> read the changed section again to verify. A plan such as "I will edit it" is not completion; keep using tools until the mutation and verification are actually done. Prefer exact old/new replacement for local edits; use full overwrite only when appropriate.\n'
          if old_prompt not in prompt:
              raise SystemExit('prompt edit rule not found')
          prompt_path.write_text(prompt.replace(old_prompt, new_prompt, 1), encoding='utf-8')

          test_path = Path('MK4/tests/test_file_mutation_completion_contract.py')
          test_path.write_text(r'''from __future__ import annotations

from MK4.core.agent.orchestrator import _file_mutation_completion_guard_result, _requires_file_mutation


def event(tool: str, *, path: str = "MK4/app/static/index.html", ok: bool = True) -> dict:
    return {
        "tool": tool,
        "arguments": {"path": path},
        "result": {"ok": ok, "path": path},
    }


def test_korean_file_edit_request_is_detected() -> None:
    assert _requires_file_mutation('index.html에서 "새 채팅" 버튼을 없애줘') is True
    assert _requires_file_mutation('MK4의 UI 코드를 수정해줘') is True
    assert _requires_file_mutation('index.html을 읽고 구조를 설명해줘') is False


def test_final_answer_after_only_file_read_is_rejected() -> None:
    guard = _file_mutation_completion_guard_result(
        user_message='index.html에서 새 채팅 버튼을 제거해줘',
        tool_history=[event('file_read')],
        rejected_final_answer='제거했습니다.',
    )
    assert guard is not None
    assert guard['error'] == 'requested_file_mutation_not_performed'


def test_plan_only_final_answer_is_rejected_before_mutation() -> None:
    guard = _file_mutation_completion_guard_result(
        user_message='HTML 코드를 수정해줘',
        tool_history=[event('file_read')],
        rejected_final_answer='이제 해당 부분을 수정하겠습니다.',
    )
    assert guard is not None
    assert guard['error'] == 'requested_file_mutation_not_performed'


def test_successful_update_without_post_read_is_rejected() -> None:
    guard = _file_mutation_completion_guard_result(
        user_message='HTML 파일을 수정해줘',
        tool_history=[event('file_read'), event('file_update')],
        rejected_final_answer='수정했습니다.',
    )
    assert guard is not None
    assert guard['error'] == 'requested_file_mutation_not_verified'


def test_successful_update_then_same_file_read_allows_completion() -> None:
    history = [event('file_read'), event('file_update'), event('file_read')]
    guard = _file_mutation_completion_guard_result(
        user_message='HTML 파일을 수정해줘',
        tool_history=history,
        rejected_final_answer='수정했습니다.',
    )
    assert guard is None


def test_read_of_other_file_does_not_verify_mutation() -> None:
    history = [
        event('file_update', path='MK4/app/static/index.html'),
        event('file_read', path='MK4/README.md'),
    ]
    guard = _file_mutation_completion_guard_result(
        user_message='HTML 파일을 수정해줘',
        tool_history=history,
        rejected_final_answer='수정했습니다.',
    )
    assert guard is not None
    assert guard['error'] == 'requested_file_mutation_not_verified'


def test_successful_delete_allows_completion_without_file_read() -> None:
    guard = _file_mutation_completion_guard_result(
        user_message='이 파일을 삭제해줘',
        tool_history=[event('file_delete')],
        rejected_final_answer='삭제했습니다.',
    )
    assert guard is None
''', encoding='utf-8')
          PY

      - name: Run focused tests
        shell: bash
        run: |
          python -m pip install -e . pytest pytest-asyncio
          pytest -q MK4/tests/test_file_mutation_completion_contract.py MK4/tests/test_agent_round_guard.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MK4/core/agent/orchestrator.py MK4/core/agent/prompts.py MK4/tests/test_file_mutation_completion_contract.py
          git commit -m "MK4: require evidence before file edit completion"
          git push origin HEAD:mk4/file-mutation-completion-contract
