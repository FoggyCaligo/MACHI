<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MACHI MK</title>
<style>
:root{--bg:#0f0f12;--surface:#18181f;--border:#2a2a35;--accent:#7c6af7;--text:#e7e7ef;--dim:#85859a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Apple SD Gothic Neo,sans-serif}
main{max-width:860px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding:8px 0 18px}.logo{font-weight:800;color:var(--accent);font-size:20px}.sub{color:var(--dim);font-size:12px}
#history{flex:1;padding:24px 0;display:flex;flex-direction:column;gap:16px}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}.input{white-space:pre-wrap}.label{font-size:11px;color:var(--dim);margin-bottom:8px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--border);border-radius:999px;padding:6px 10px;background:#22222c}.chip strong{color:var(--accent)}
form{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:16px 0;display:flex;gap:10px}textarea{flex:1;resize:none;min-height:54px;max-height:180px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:14px;font:inherit}button{background:var(--accent);color:white;border:0;border-radius:12px;padding:0 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.empty{margin:auto;color:var(--dim);text-align:center}.alphs{font-family:Consolas,monospace;color:var(--dim);word-break:break-all}
</style>
</head>
<body><main>
<header><div><div class="logo">MACHI MK</div><div class="sub">alph → seq → proj → segment</div></div><div class="sub">공백과 문장부호도 alph로 취급</div></header>
<section id="history"><div class="empty" id="empty"><b>문장이나 단어를 입력하세요.</b><br>입력은 매번 새 seq로 저장됩니다.</div></section>
<form id="form"><textarea id="text" placeholder="예: 엄마가 분유 타줄게" required></textarea><button id="send">처리</button></form>
</main><script>
const form=document.querySelector('#form'),text=document.querySelector('#text'),history=document.querySelector('#history'),send=document.querySelector('#send');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
form.addEventListener('submit',async e=>{e.preventDefault();const value=text.value;if(!value)return;send.disabled=true;try{const r=await fetch('/process',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'처리 실패');document.querySelector('#empty')?.remove();const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="label">SEQ #${d.input_id}</div><div class="input">${esc(d.text)}</div><div class="label" style="margin-top:16px">ALPHS</div><div class="alphs">${d.alphs.map(a=>`[${esc(a===' '?'␠':a)}]`).join(' ')}</div><div class="label" style="margin-top:16px">SEGMENTS</div><div class="chips">${d.evidence.map(x=>`<span class="chip"><strong>${esc(x.text===' '?'␠':x.text)}</strong> · ${x.support}</span>`).join('')}</div>`;history.append(card);text.value='';card.scrollIntoView({behavior:'smooth'});}catch(err){alert(err.message)}finally{send.disabled=false;text.focus()}});
text.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script></body></html>
