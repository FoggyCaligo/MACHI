<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MK6</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f12;
      --surface: #18181f;
      --border: #2a2a35;
      --accent: #7c6af7;
      --accent-dim: #4a4280;
      --text: #e4e4ef;
      --text-dim: #6b6b80;
      --user-bg: #252538;
      --assistant-bg: #1c1c28;
      --danger: #e05260;
      --meta: #4b4b62;
      --radius: 12px;
      --font: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
    #app { display: flex; flex-direction: column; height: 100vh; max-width: 800px; margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 18px; font-weight: 700; letter-spacing: .5px; color: var(--accent); }
    .logo span { color: var(--text-dim); font-weight: 400; font-size: 13px; margin-left: 8px; }
    #new-chat-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .user-id-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
    }
    .user-id-wrap label { font-size: 11px; color: var(--text-dim); }
    #user-id-input {
      width: 170px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      font-family: var(--font);
    }
    #model-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      outline: none;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg-row { display: flex; gap: 10px; align-items: flex-start; }
    .msg-row.user { flex-direction: row-reverse; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .avatar.assistant { background: var(--accent-dim); color: var(--accent); }
    .avatar.user { background: var(--user-bg); color: var(--text-dim); }
    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user .bubble { background: var(--user-bg); border-top-right-radius: 4px; }
    .msg-row.assistant .bubble { background: var(--assistant-bg); border-top-left-radius: 4px; }
    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--meta);
    }
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-dim);
    }
    #empty-state .big { font-size: 36px; color: var(--accent); font-weight: 700; }
    #input-area {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      background: var(--bg);
    }
    #input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }
    #msg-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      resize: none;
      min-height: 24px;
      max-height: 140px;
      line-height: 1.5;
    }
    #send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">MK6 <span>lang graph prototype</span></div>
    <div class="header-right">
      <div class="user-id-wrap">
        <label for="user-id-input">user_id</label>
        <input id="user-id-input" type="text" placeholder="사용자 ID" />
      </div>
      <select id="model-select" title="모드 선택">
        <option value="lang-graph">lang-graph</option>
      </select>
      <button id="new-chat-btn">새 채팅</button>
    </div>
  </header>

  <div id="messages">
    <div id="empty-state">
      <div class="big">MK6</div>
      <div class="sub">문장을 넣으면 LANG_GRAPH가 segment 리스트를 만듭니다.</div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="msg-input" rows="1" placeholder="메시지를 입력하세요..."></textarea>
      <button id="send-btn">전송</button>
    </div>
  </div>
</div>

<script>
  const state = {
    userId: window.localStorage.getItem('MK6:user-id') || 'default_user',
    sessionId: window.localStorage.getItem('MK6:session-id') || `session-${Date.now()}`,
    loading: false,
  };

  window.localStorage.setItem('MK6:session-id', state.sessionId);

  const $messages = document.getElementById('messages');
  const $emptyState = document.getElementById('empty-state');
  const $msgInput = document.getElementById('msg-input');
  const $sendBtn = document.getElementById('send-btn');
  const $newChatBtn = document.getElementById('new-chat-btn');
  const $userIdInput = document.getElementById('user-id-input');

  $userIdInput.value = state.userId;
  $userIdInput.addEventListener('change', () => {
    state.userId = $userIdInput.value.trim() || 'default_user';
    $userIdInput.value = state.userId;
    window.localStorage.setItem('MK6:user-id', state.userId);
  });

  $msgInput.addEventListener('input', () => {
    $msgInput.style.height = 'auto';
    $msgInput.style.height = Math.min($msgInput.scrollHeight, 140) + 'px';
  });

  $sendBtn.addEventListener('click', sendMessage);
  $msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  $newChatBtn.addEventListener('click', () => {
    const rows = $messages.querySelectorAll('.msg-row');
    rows.forEach((row) => row.remove());
    $emptyState.style.display = 'flex';
    state.sessionId = `session-${Date.now()}`;
    window.localStorage.setItem('MK6:session-id', state.sessionId);
  });

  async function sendMessage() {
    if (state.loading) return;
    const text = $msgInput.value.trim();
    if (!text) return;

    appendBubble('user', text);
    $emptyState.style.display = 'none';
    $msgInput.value = '';
    $msgInput.style.height = 'auto';

    state.loading = true;
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: state.userId,
          session_id: state.sessionId,
          message: text,
          model: 'lang-graph',
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'request failed');
      appendAssistantBubble(data.response, data);
    } catch (error) {
      appendBubble('assistant', `[오류] ${error.message}`);
    } finally {
      state.loading = false;
    }
  }

  function appendBubble(role, text) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role === 'user' ? 'user' : 'assistant'}`;
    avatar.textContent = role === 'user' ? 'YOU' : 'M6';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    $messages.appendChild(row);
    $messages.scrollTop = $messages.scrollHeight;
  }

  function appendAssistantBubble(text, metaData) {
    const row = document.createElement('div');
    row.className = 'msg-row assistant';

    const avatar = document.createElement('div');
    avatar.className = 'avatar assistant';
    avatar.textContent = 'M6';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `
      <span>◉ 노드 ${metaData.node_count}</span>
      <span>— 엣지 ${metaData.edge_count}</span>
      <span>🤖 ${metaData.model_used}</span>
    `;
    bubble.appendChild(meta);

    row.appendChild(avatar);
    row.appendChild(bubble);
    $messages.appendChild(row);
    $messages.scrollTop = $messages.scrollHeight;
  }
</script>
</body>
</html>
