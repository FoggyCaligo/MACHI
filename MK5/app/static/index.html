<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MK5</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f12;
      --surface: #18181f;
      --border: #2a2a35;
      --accent: #5ea0ff;
      --accent-dim: #2f4d7a;
      --text: #e4e4ef;
      --text-dim: #7e8296;
      --user-bg: #252538;
      --MK5-bg: #17202d;
      --danger: #d85b67;
      --meta: #596178;
      --radius: 12px;
      --font: "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 980px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }

    .logo span {
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 400;
      margin-left: 8px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip-input, #model-select, #image-model-select, #new-chat-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 20px;
      padding: 7px 12px;
      font-size: 12px;
      outline: none;
    }

    .chip-input { width: 180px; }
    #model-select, #image-model-select { max-width: 180px; cursor: pointer; }
    #new-chat-btn { cursor: pointer; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-dim);
      text-align: center;
    }

    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .avatar.MK5 { background: var(--accent-dim); color: var(--accent); }
    .avatar.user { background: var(--user-bg); color: var(--text-dim); }

    .bubble {
      width: fit-content;
      min-width: 140px;
      max-width: min(78%, 720px);
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-row.user .bubble {
      background: var(--user-bg);
      border-top-right-radius: 4px;
      margin-left: auto;
    }

    .msg-row.MK5 .bubble {
      background: var(--MK5-bg);
      border-top-left-radius: 4px;
      min-width: 220px;
    }

    .bubble-text {
      color: var(--text);
      white-space: pre-wrap;
    }

    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--meta);
    }

    .tool-panel {
      margin-top: 8px;
      border-top: 1px dashed var(--border);
      padding-top: 8px;
    }

    .tool-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
    }

    .tool-log {
      margin-top: 8px;
      display: none;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .tool-log.open {
      display: grid;
    }

    .tool-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      white-space: pre-wrap;
      overflow-x: auto;
      max-height: 180px;
    }

    #input-area {
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      background: var(--bg);
    }

    #input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }

    #msg-input {
      flex: 1;
      min-height: 24px;
      max-height: 140px;
      resize: none;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
    }

    #send-btn {
      background: var(--accent);
      border: none;
      color: white;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    #attach-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    #attachment-list {
      display: none;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      color: var(--text-dim);
      font-size: 12px;
    }

    .attachment-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 999px;
      padding: 5px 9px;
    }

    .loader {
      display: flex;
      gap: 5px;
      padding: 10px 14px;
      background: var(--MK5-bg);
      border-radius: var(--radius);
      border-top-left-radius: 4px;
      width: fit-content;
      min-width: 96px;
    }

    .loader span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-dim);
      animation: bounce .9s infinite;
    }

    .loader span:nth-child(2) { animation-delay: .15s; }
    .loader span:nth-child(3) { animation-delay: .3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); background: var(--accent); }
    }

    @media (max-width: 720px) {
      #app { max-width: 100%; }
      header { align-items: flex-start; }
      .header-right { width: 100%; justify-content: flex-start; }
      .bubble {
        min-width: 0;
        max-width: calc(100% - 52px);
      }
      .msg-row.MK5 .bubble { min-width: 0; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">MK5 <span>tool-using graph memory agent</span></div>
    <div class="header-right">
      <input id="user-id-input" class="chip-input" placeholder="USER_ID 입력" value="default-user" />
      <select id="model-select" title="대화 모델 선택">
        <option value="">모델 로딩 중...</option>
      </select>
      <select id="image-model-select" title="이미지 인식 모델 선택">
        <option value="">이미지 모델 로딩 중...</option>
      </select>
      <button id="new-chat-btn">새 채팅</button>
    </div>
  </header>

  <div id="messages">
    <div id="empty-state">
      <div style="font-size:36px;color:var(--accent);font-weight:700;">MK5</div>
      <div>USER_ID를 넣고 메시지를 보내면, 선택한 sLLM이 기억, 검색, 파일, 터미널, 시장 스냅샷 도구를 사용할 수 있습니다.</div>
    </div>
  </div>

  <div id="input-area">
    <div id="attachment-list"></div>
    <div id="input-row">
      <textarea id="msg-input" rows="1" placeholder="메시지를 입력하세요..."></textarea>
      <input id="file-input" type="file" multiple hidden />
      <button id="attach-btn" type="button" title="파일 첨부">📎</button>
      <button id="send-btn">전송</button>
    </div>
  </div>
</div>

<script>
  const state = { loading: false, attachments: [] };
  const $messages = document.getElementById("messages");
  const $emptyState = document.getElementById("empty-state");
  const $modelSelect = document.getElementById("model-select");
  const $imageModelSelect = document.getElementById("image-model-select");
  const $userIdInput = document.getElementById("user-id-input");
  const $msgInput = document.getElementById("msg-input");
  const $sendBtn = document.getElementById("send-btn");
  const $attachBtn = document.getElementById("attach-btn");
  const $fileInput = document.getElementById("file-input");
  const $attachmentList = document.getElementById("attachment-list");
  const $newChatBtn = document.getElementById("new-chat-btn");

  async function loadModels() {
    try {
      const res = await fetch("/models");
      const data = await res.json();
      const models = data.models || [];
      const current = data.current || "";
      const currentImage = data.current_image || current || "";
      $modelSelect.innerHTML = "";
      $imageModelSelect.innerHTML = "";
      if (models.length === 0) {
        $modelSelect.innerHTML = '<option value="">모델 없음</option>';
        $imageModelSelect.innerHTML = '<option value="">모델 없음</option>';
        return;
      }
      models.forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        if (name === current) opt.selected = true;
        $modelSelect.appendChild(opt);

        const imageOpt = document.createElement("option");
        imageOpt.value = name;
        imageOpt.textContent = `이미지: ${name}`;
        if (name === currentImage) imageOpt.selected = true;
        $imageModelSelect.appendChild(imageOpt);
      });
    } catch (err) {
      $modelSelect.innerHTML = '<option value="">연결 실패</option>';
      $imageModelSelect.innerHTML = '<option value="">연결 실패</option>';
    }
  }

  loadModels();

  $msgInput.addEventListener("input", () => {
    $msgInput.style.height = "auto";
    $msgInput.style.height = Math.min($msgInput.scrollHeight, 140) + "px";
  });

  $sendBtn.addEventListener("click", sendMessage);
  $attachBtn.addEventListener("click", () => $fileInput.click());
  $fileInput.addEventListener("change", () => {
    state.attachments = Array.from($fileInput.files || []);
    renderAttachments();
  });
  $msgInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  $newChatBtn.addEventListener("click", () => {
    document.querySelectorAll(".msg-row, .loader-row").forEach((el) => el.remove());
    $emptyState.style.display = "flex";
    $msgInput.value = "";
    $msgInput.style.height = "auto";
    clearAttachments();
  });

  async function sendMessage() {
    if (state.loading) return;
    const rawMessage = $msgInput.value.trim();
    const userId = $userIdInput.value.trim();
    if ((!rawMessage && state.attachments.length === 0) || !userId) return;

    $emptyState.style.display = "none";
    const pendingAttachmentNames = state.attachments.map((file) => file.name);
    appendUserBubble(userId, rawMessage || "(첨부 파일)", pendingAttachmentNames);
    $msgInput.value = "";
    $msgInput.style.height = "auto";

    const loaderRow = appendLoader();
    state.loading = true;
    $sendBtn.disabled = true;

    try {
      const uploaded = [];
      for (const file of state.attachments) {
        uploaded.push(await uploadAttachment(file));
      }
      const attachmentText = uploaded.length
        ? "\n\n[첨부 파일]\n다음은 MK5 서버에 업로드된 파일 경로입니다. 원본 로컬 경로를 추측하지 말고 아래 경로를 도구로 읽어주세요.\n"
          + uploaded.map((item) => `- ${item.filename}: ${item.path}`).join("\n")
        : "";
      const message = (rawMessage || "첨부 파일을 확인해줘.") + attachmentText;
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user_id: userId,
          message,
          model: $modelSelect.value || null,
          image_model: $imageModelSelect.value || null
        }),
      });
      const raw = await res.text();
      let data = {};
      try {
        data = raw ? JSON.parse(raw) : {};
      } catch (parseErr) {
        data = { detail: raw || res.statusText };
      }
      if (!res.ok) throw new Error(data.detail || res.statusText);
      loaderRow.remove();
      appendMk5Bubble(data);
      clearAttachments();
    } catch (err) {
      loaderRow.remove();
      appendErrorBubble(err.message || String(err));
    } finally {
      state.loading = false;
      $sendBtn.disabled = false;
      $msgInput.focus();
    }
  }

  async function uploadAttachment(file) {
    const form = new FormData();
    form.append("file", file);
    const res = await fetch("/upload", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.detail || data.message || "파일 업로드 실패");
    return data;
  }

  function renderAttachments() {
    if (state.attachments.length === 0) {
      $attachmentList.style.display = "none";
      $attachmentList.innerHTML = "";
      return;
    }
    $attachmentList.style.display = "flex";
    $attachmentList.innerHTML = state.attachments.map((file) =>
      `<span class="attachment-chip">📎 ${escapeHtml(file.name)}</span>`
    ).join("");
  }

  function clearAttachments() {
    state.attachments = [];
    $fileInput.value = "";
    renderAttachments();
  }

  function appendUserBubble(userId, text, attachmentNames = []) {
    const attachmentHtml = attachmentNames.length
      ? `<div class="meta">${attachmentNames.map((name) => `<span>📎 ${escapeHtml(name)}</span>`).join("")}</div>`
      : "";
    const row = document.createElement("div");
    row.className = "msg-row user";
    row.innerHTML = `
      <div class="avatar user">YOU</div>
      <div class="bubble">
        <div class="bubble-text">${escapeHtml(text)}</div>
        <div class="meta"><span>USER_ID ${escapeHtml(userId)}</span></div>
        ${attachmentHtml}
      </div>
    `;
    $messages.appendChild(row);
    scrollBottom();
  }

  function appendMk5Bubble(data) {
    const row = document.createElement("div");
    row.className = "msg-row MK5";
    const toolEvents = Array.isArray(data.tool_events) ? data.tool_events : [];
    const toolPanel = toolEvents.length ? `
      <div class="tool-panel">
        <button class="tool-toggle" type="button">툴 로그 ${toolEvents.length}개 보기</button>
        <div class="tool-log">
          ${toolEvents.map((event, idx) => `
            <div class="tool-item">#${idx + 1}
tool: ${escapeHtml(event.tool)}
args: ${escapeHtml(JSON.stringify(event.arguments, null, 2))}
result: ${escapeHtml(JSON.stringify(event.result, null, 2))}</div>
          `).join("")}
        </div>
      </div>
    ` : "";

    row.innerHTML = `
      <div class="avatar MK5">M5</div>
      <div class="bubble">
        <div class="bubble-text">${escapeHtml(data.text || "(응답 없음)")}</div>
        <div class="meta">
          <span>tools ${escapeHtml(String((data.used_tools || []).length))}</span>
          <span>writes ${escapeHtml(String((data.memory_writes || []).length))}</span>
        </div>
        ${toolPanel}
      </div>
    `;

    const toggle = row.querySelector(".tool-toggle");
    const log = row.querySelector(".tool-log");
    if (toggle && log) {
      toggle.addEventListener("click", () => {
        const isOpen = log.classList.toggle("open");
        toggle.textContent = isOpen ? `툴 로그 ${toolEvents.length}개 접기` : `툴 로그 ${toolEvents.length}개 보기`;
      });
    }

    $messages.appendChild(row);
    scrollBottom();
  }

  function appendErrorBubble(message) {
    const row = document.createElement("div");
    row.className = "msg-row MK5";
    row.innerHTML = `
      <div class="avatar MK5">M5</div>
      <div class="bubble" style="color:var(--danger)">[오류] ${escapeHtml(message)}</div>
    `;
    $messages.appendChild(row);
    scrollBottom();
  }

  function appendLoader() {
    const row = document.createElement("div");
    row.className = "msg-row MK5 loader-row";
    row.innerHTML = `
      <div class="avatar MK5">M5</div>
      <div class="loader"><span></span><span></span><span></span></div>
    `;
    $messages.appendChild(row);
    scrollBottom();
    return row;
  }

  function scrollBottom() {
    $messages.scrollTop = $messages.scrollHeight;
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
